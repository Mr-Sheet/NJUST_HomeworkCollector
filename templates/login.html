{% extends 'base.html' %}

{% block nav_tag %}<span class="nav-tag ms-auto">教师端</span>{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: 55vh; align-items: center;">
    <div class="col-lg-4 col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div style="font-size: 2.4rem;">🔐</div>
                    <h1 class="h4 fw-bold mt-2 mb-1">教师端登录</h1>
                    <p class="text-muted mb-0" style="font-size:.88rem">
                        管理作业需要验证身份，学生请使用老师分享的作业链接
                    </p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2" style="font-size:.9rem">{{ message }}</div>
                    {% endfor %}
                {% endwith %}

                <form method="POST" action="{{ url_for('login') }}">
                    <label class="form-label" for="password">访问密码</label>
                    <input type="password" class="form-control form-control-lg mb-3"
                           id="password" name="password" placeholder="请输入教师端密码" required autofocus>
                    <button type="submit" class="btn btn-primary w-100 py-2">进入管理页</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
